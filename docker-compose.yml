# Default stack: API + PostgreSQL. For SQL Server use docker-compose.sqlserver.yml instead.
services:
  db:
    image: postgres:17-alpine
    environment:
      # Local dev only — never a real credential, never used outside this compose file.
      POSTGRES_DB: adaplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Only with --profile api: a plain "docker compose up -d" starts the database alone, so a
    # container API never takes port 8080 from the API run from source (dotnet run).
    profiles: [api]
    build:
      context: .
      dockerfile: src/AdaPlatform.Api/Dockerfile
    environment:
      Database__Provider: Postgres
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=adaplatform;Username=postgres;Password=postgres"
      # Mapy.com key from the gitignored .env file next to this compose file (MAPY_API_KEY=...).
      # Without it the map falls back to OpenStreetMap.
      Map__MapyComApiKey: ${MAPY_API_KEY:-}
      # Sign-in through Tokari. The key is Tokari's JwtSettings:SigningKey, from .env.
      # With docker-compose.tokari.yml, a local Tokari runs next to the API.
      Tokari__BaseUrl: ${TOKARI_URL:-http://host.docker.internal:8091/}
      Tokari__SigningKey: ${TOKARI_SIGNING_KEY:?set TOKARI_SIGNING_KEY in .env (Tokari's JwtSettings:SigningKey)}
      Tokari__ApiKey: ${TOKARI_API_KEY:-}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"
    volumes:
      - tile-cache:/app/tile-cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  tile-cache:
