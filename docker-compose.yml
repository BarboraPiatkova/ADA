services:
  db:
    image: postgres:17-alpine
    environment:
      # Local dev only — never a real credential, never used outside this compose file.
      POSTGRES_DB: adaplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/AdaPlatform.Api
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=adaplatform;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
