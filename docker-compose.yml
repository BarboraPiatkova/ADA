# Default stack: API + PostgreSQL. For SQL Server use docker-compose.sqlserver.yml instead.
services:
  db:
    image: postgres:17-alpine
    environment:
      # Local dev only — never a real credential, never used outside this compose file.
      POSTGRES_DB: adaplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AdaPlatform.Api/Dockerfile
    environment:
      Database__Provider: Postgres
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=adaplatform;Username=postgres;Password=postgres"
      # Mapy.com key from the gitignored .env file next to this compose file (MAPY_API_KEY=...).
      # Without it the map falls back to OpenStreetMap.
      Map__MapyComApiKey: ${MAPY_API_KEY:-}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"
    volumes:
      - tile-cache:/app/tile-cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  tile-cache:
