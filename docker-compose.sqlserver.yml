# Same stack on SQL Server:  docker compose -f docker-compose.sqlserver.yml up
# Same API image — only Database__Provider and the connection string differ.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Local dev only — never a real credential, never used outside this compose file.
      MSSQL_SA_PASSWORD: "LocalDev_Only_1"
    ports:
      - "1433:1433"
    volumes:
      - db-data-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/AdaPlatform.Api/Dockerfile
    environment:
      Database__Provider: SqlServer
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Server=db,1433;Database=adaplatform;User Id=sa;Password=LocalDev_Only_1;TrustServerCertificate=True"
      # Mapy.com key from the gitignored .env file next to this compose file (MAPY_API_KEY=...).
      # Without it the map falls back to OpenStreetMap.
      Map__MapyComApiKey: ${MAPY_API_KEY:-}
      # Sign-in through Tokari. The key is Tokari's JwtSettings:SigningKey, from .env.
      # With docker-compose.tokari.yml, a local Tokari runs next to the API.
      Tokari__BaseUrl: ${TOKARI_URL:-http://host.docker.internal:8091/}
      Tokari__SigningKey: ${TOKARI_SIGNING_KEY:?set TOKARI_SIGNING_KEY in .env (Tokari's JwtSettings:SigningKey)}
      Tokari__ApiKey: ${TOKARI_API_KEY:-}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"
    volumes:
      - tile-cache:/app/tile-cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data-mssql:
  tile-cache:
